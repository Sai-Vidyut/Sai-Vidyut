# Renders the GitHub contribution graph as a snake animation.
# March 2026 is sanitized to six days (18–23) before rendering.

name: snake

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "README.md"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5

      - name: Build snake SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: node scripts/build_snake.mjs

      - name: Publish to output branch
        run: |
          set -euo pipefail

          for f in dist/snake-light.svg dist/snake-dark.svg; do
            if [ ! -s "$f" ]; then
              echo "::error::$f was not generated"
              exit 1
            fi
          done

          staging="$(mktemp -d)"
          cp dist/snake-light.svg dist/snake-dark.svg "$staging/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output
            git checkout -B output origin/output
          else
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
            find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          fi

          cp "$staging/snake-light.svg" "$staging/snake-dark.svg" .
          git add snake-light.svg snake-dark.svg

          if git diff --cached --quiet; then
            echo "Contribution graph unchanged since last run; nothing to publish."
            exit 0
          fi

          git commit -m "chore(snake): regenerate from contribution graph"
          git push origin output
